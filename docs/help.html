<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help - Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="https://menutech.services/assets/img/logomt.png" alt="Logo" style="height: 50px;">
            </div>
            <div class="user-profile" id="user-profile-btn">
                <i class="far fa-comment-alt header-help-icon" id="help-nav-icon"></i>
                <div class="user-details">
                    <span class="user-name">user <i class="fas fa-caret-down"></i></span>
                    <span class="user-email">user@menutech.xyz</span>
                </div>
                <div class="user-submenu" id="user-submenu">
                    <div class="user-submenu-item">
                        <i class="fas fa-sign-out-alt"></i> Sign out
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="icon-sidebar">
                <div class="icon-item" data-target="setup.html">
                    <i class="fas fa-cog fa-lg"></i>
                </div>
                <div class="icon-item" data-target="kickstarter.html">
                    <i class="fas fa-bullseye fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-chart-line fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-sliders-h fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-ellipsis-h fa-lg"></i>
                </div>
            </aside>

            <main class="page-body">
                <div class="help-content-area">
                    <h1 style="margin-bottom: 30px;">We are happy to help</h1>

                    <div class="help-box">
                        <div class="help-box-header">
                            MenuTech
                            <i class="fas fa-chevron-up"></i>
                        </div>
                        <div class="help-box-body">
                            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                                <i class="fas fa-envelope" style="margin-right: 10px;"></i> menutecho@gmail.com &nbsp;&nbsp;
                                <i class="fas fa-phone" style="margin-right: 10px;"></i> (877) 859-0858 &nbsp;&nbsp;
                                <i class="fas fa-globe" style="margin-right: 10px;"></i> www.menutech.xyz
                            </p>

                            <label style="font-size: 14px; color: #333; font-weight: 500;">How can we help you today?</label>
                            <textarea class="help-textarea" placeholder="Type your question here, I'm happy to help"></textarea>

                            <button class="help-submit">Ask Question</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
