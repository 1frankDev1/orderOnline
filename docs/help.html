<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help - Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="https://menutech.services/assets/img/logomt.png" alt="Logo" style="height: 35px;">
            </div>
            <div class="user-profile" id="user-profile-btn">
                <i class="far fa-comment-alt header-help-icon" id="help-nav-icon" style="color: #f27a20;"></i>
                <div class="user-details">
                    <span class="user-name">user <i class="fas fa-caret-down"></i></span>
                    <span class="user-email">user@menutech.xyz</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="icon-sidebar">
                <div class="icon-item" data-target="setup.html">
                    <i class="fas fa-cog fa-lg"></i>
                </div>
                <div class="icon-item" data-target="kickstarter.html">
                    <i class="fas fa-bullseye fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-chart-line fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-sliders-h fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-ellipsis-h fa-lg"></i>
                </div>
            </aside>

            <aside class="setup-sidebar">
                <div class="setup-title">Help</div>
                <div class="menu-section">
                    <div class="menu-header">Contact Support</div>
                </div>
            </aside>

            <main class="page-body">
                <div class="help-content-area" style="width: 100%;">
                    <div class="help-box">
                        <div class="help-box-header">
                            <span>How can we help?</span>
                            <i class="fas fa-times" style="cursor: pointer; color: #999;" onclick="window.history.back()"></i>
                        </div>
                        <div class="help-box-body">
                            <p style="font-size: 16px; color: #666; margin-bottom: 10px;">Please describe your issue or question below.</p>
                            <textarea class="help-textarea" placeholder="Type your message here..."></textarea>
                            <button class="help-submit">Send Message</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
