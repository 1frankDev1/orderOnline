<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kickstarter - Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="https://menutech.services/assets/img/logomt.png" alt="Logo" style="height: 35px;">
            </div>
            <div class="user-profile" id="user-profile-btn">
                <i class="far fa-comment-alt header-help-icon" id="help-nav-icon"></i>
                <div class="user-details">
                    <span class="user-name">user <i class="fas fa-caret-down"></i></span>
                    <span class="user-email">user@menutech.xyz</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="icon-sidebar">
                <div class="icon-item" data-target="setup.html">
                    <i class="fas fa-cog fa-lg"></i>
                </div>
                <div class="icon-item active" data-target="kickstarter.html">
                    <i class="fas fa-bullseye fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-chart-line fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-sliders-h fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-ellipsis-h fa-lg"></i>
                </div>
            </aside>

            <aside class="setup-sidebar">
                <div class="setup-title">Kickstarter</div>

                <div class="menu-section">
                    <div class="menu-header">Overview</div>
                </div>
            </aside>

            <main class="page-body">
                <div id="dynamic-content-area">
                    <div style="padding: 100px; text-align: center; background: white; border-radius: 8px; margin: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 800px;">
                        <h1 style="color: #333; font-size: 24px; margin-bottom: 20px;">Kickstarter Overview</h1>
                        <p style="color: #666; font-size: 16px;">This module allows you to track your restaurant's launch progress.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
