<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Tools - Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="https://menutech.services/assets/img/logomt.png" alt="Logo" style="height: 40px;">
            </div>
            <div class="restaurant-info">
                <i class="fas fa-caret-down"></i>
            </div>
            <div class="user-profile">
                <i class="far fa-comment-alt"></i>
                <div class="user-details">
                    <span class="user-name">Rudis Sorto <i class="fas fa-caret-down"></i></span>
                    <span class="user-email">user@menutech.xyz</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="icon-sidebar">
                <div class="icon-item" data-target="setup.html">
                    <i class="fas fa-cog fa-lg"></i>
                </div>
                <div class="icon-item active" data-target="kickstarter.html">
                    <i class="fas fa-bullseye fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-chart-line fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-sliders-h fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-ellipsis-h fa-lg"></i>
                </div>
            </aside>

            <aside class="setup-sidebar">
                <div class="setup-title">Marketing Tools</div>

                <div class="menu-section">
                    <div class="menu-header" id="kickstarter-header">
                        Kickstarter <i class="fas fa-chevron-down"></i>
                    </div>
                    <ul class="submenu expanded" id="kickstarter-submenu">
                        <li class="submenu-item active" data-slug="overview">Overview</li>
                        <li class="submenu-item" data-slug="first-buy-promo">First buy promo</li>
                        <li class="submenu-item" data-slug="invite-prospects">Invite Prospects</li>
                    </ul>
                </div>

                <div class="menu-section">
                    <div class="menu-header">Website scanner <i class="fas fa-chevron-right"></i></div>
                </div>

                <div class="menu-section">
                    <div class="menu-header">Google business <i class="fas fa-chevron-right"></i></div>
                </div>

                <div class="menu-section">
                    <div class="menu-header">Promotions <i class="fas fa-chevron-right"></i></div>
                </div>

                <div class="menu-section">
                    <div class="menu-header">QR codes & Flyers <i class="fas fa-chevron-right"></i></div>
                </div>
            </aside>

            <main class="page-body">
                <div id="dynamic-content-area">
                    <div style="padding: 40px;">
                        <h1>Kickstarter Overview</h1>
                        <p>Welcome to the kickstarter panel.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
