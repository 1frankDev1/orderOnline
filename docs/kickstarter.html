<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kickstarter - Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <div class="logo-box">
                    <i class="fas fa-utensils"></i>
                </div>
            </div>
            <div class="restaurant-info">
                El Cuzcatlan Restaurant Bar & Grill <i class="fas fa-caret-down"></i>
            </div>
            <div class="user-profile">
                <i class="far fa-comment-alt"></i>
                <div class="user-details">
                    <span class="user-name">Rudis Sorto <i class="fas fa-caret-down"></i></span>
                    <span class="user-email">elcuzcatlan@menutech.xyz</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="icon-sidebar">
                <div class="icon-item" data-target="setup.html">
                    <i class="fas fa-cog fa-lg"></i>
                </div>
                <div class="icon-item active" data-target="kickstarter.html">
                    <i class="fas fa-bullseye fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-chart-line fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-sliders-h fa-lg"></i>
                </div>
                <div class="icon-item">
                    <i class="fas fa-ellipsis-h fa-lg"></i>
                </div>
            </aside>

            <aside class="setup-sidebar">
                <div class="setup-title">Kickstarter</div>

                <div class="menu-section">
                    <div class="menu-header">
                        Overview <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                <div class="menu-section">
                    <div class="menu-header">
                        Tasks <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </aside>

            <main class="page-body">
                <div style="padding: 40px;">
                    <h1>Kickstarter Overview</h1>
                    <p>Welcome to the kickstarter panel.</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
